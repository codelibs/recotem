{{- if .Values.train.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "recotem.fullname" . }}-train
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recotem.labels" . | nindent 4 }}
    app.kubernetes.io/component: train
spec:
  # Default: daily at 02:00 UTC.  Override via .Values.train.schedule.
  schedule: {{ .Values.train.schedule | quote }}
  concurrencyPolicy: {{ .Values.train.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.train.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.train.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # Allow up to 1 h for a single training run before hard-kill.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            {{- include "recotem.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: train
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "recotem.serviceAccountName" . }}
          # Kubernetes injects a legacy Docker-link env var per Service in the
          # namespace, named <SERVICE>_PORT and valued `tcp://<clusterIP>:<port>`.
          # The chart's own Service is `recotem` by default, so every pod created
          # after it in the namespace inherits
          # `RECOTEM_PORT=tcp://10.96.0.1:8080` -- and RECOTEM_PORT is one of the
          # variables recotem treats as fatal when it does not parse as an
          # integer.  `recotem serve` and `recotem inspect` then exit 8 with
          # "Configuration error: RECOTEM_PORT must be an integer", naming a
          # variable the operator never set.  The serve container only escapes it
          # by setting RECOTEM_PORT explicitly; blanking `env.RECOTEM_PORT` in
          # values.yaml drops that line and re-opens the hole.  These env vars
          # have been deprecated since Kubernetes 1.13 and nothing here reads
          # them.
          enableServiceLinks: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          restartPolicy: OnFailure

          {{- /* Mirror the serve Deployment: when recipes.source=objectStore,
                 sync the bucket into the shared emptyDir before train runs.
                 Without this, train would loop over an empty /recipes. */}}
          {{- if eq .Values.recipes.source "objectStore" }}
          {{- if not .Values.recipes.objectStore.initContainer }}
          {{- fail "recipes.source=objectStore requires recipes.objectStore.initContainer to be set" }}
          {{- end }}
          {{- /* The chart's own mounts are MERGED into the operator's spec rather
                 than emitted as sibling keys under it.  Emitting `volumeMounts:`
                 (or `name:`) a second time in the same mapping is not an error for
                 any validator in the path — helm lint, helm template and
                 `kubectl apply --dry-run=server --validate=strict` all accept it —
                 but Go's YAML decoder is last-key-wins, so the operator's own
                 mounts (bucket credentials, a CA bundle) were silently dropped and
                 the sync container failed at runtime for no visible reason.

                 Precedence: an operator-supplied `name` wins, `sync-recipes` is
                 only the default, so an existing spec that names its container
                 keeps that name.  The chart's `recipes` mount is the exception —
                 it is appended last and any operator entry of the same name is
                 dropped, because redirecting it would leave train looping over an
                 unpopulated emptyDir.  Keep this block identical to the one in
                 deployment.yaml. */}}
          {{- $ic := deepCopy .Values.recipes.objectStore.initContainer }}
          {{- $mounts := list }}
          {{- range default (list) $ic.volumeMounts }}
          {{- if ne .name "recipes" }}{{ $mounts = append $mounts . }}{{ end }}
          {{- end }}
          {{- $mounts = append $mounts (dict "name" "recipes" "mountPath" $.Values.recipes.mountPath) }}
          {{- $_ := set $ic "volumeMounts" $mounts }}
          {{- $_ := set $ic "name" (default "sync-recipes" $ic.name) }}
          {{- $_ := set $ic "securityContext" (mergeOverwrite (deepCopy .Values.securityContext) (default (dict) $ic.securityContext)) }}
          initContainers:
            {{- toYaml (list $ic) | nindent 12 }}
          {{- end }}

          containers:
            - name: train
              image: {{ include "recotem.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- if .Values.train.recipeFiles }}
              # Train specific recipe files listed in .Values.train.recipeFiles.
              # recipeFiles must be a YAML list (e.g. ["a.yaml","b.yaml"]).
              # A legacy comma-separated string is also accepted but deprecated —
              # migrate to the list form.  Both forms are split here at *render*
              # time and emitted as one `recotem train` line per recipe, so the
              # generated script stays POSIX sh: /bin/sh in the image is dash,
              # which has neither arrays, `<<<` here-strings, nor `${var// /}`
              # substitution.
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  {{- if kindIs "slice" .Values.train.recipeFiles }}
                  {{- range $r := .Values.train.recipeFiles }}
                  recotem train {{ $.Values.recipes.mountPath }}/{{ $r }}{{ if $.Values.train.failOnBusy }} --fail-on-busy{{ end }}
                  {{- end }}
                  {{- else }}
                  {{- $legacy := list }}
                  {{- range $r := splitList "," (toString .Values.train.recipeFiles) }}
                  {{- with trim $r }}{{ $legacy = append $legacy . }}{{ end }}
                  {{- end }}
                  {{- if not $legacy }}
                  {{- fail (printf "train.recipeFiles is the string %q but contains no recipe file names; use a YAML list, e.g. recipeFiles: [\"news.yaml\"]" (toString .Values.train.recipeFiles)) }}
                  {{- end }}
                  {{- range $r := $legacy }}
                  recotem train {{ $.Values.recipes.mountPath }}/{{ $r }}{{ if $.Values.train.failOnBusy }} --fail-on-busy{{ end }}
                  {{- end }}
                  {{- end }}
              {{- else }}
              # Train all *.yaml recipes in the recipes directory.
              # Fail explicitly when the directory is empty so a misconfigured
              # objectStore sync (or wrong PVC) surfaces as a CronJob failure
              # rather than a silent exit 0.
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  shopt -s nullglob 2>/dev/null || true
                  count=0
                  for recipe in {{ .Values.recipes.mountPath }}/*.yaml; do
                    [ -f "$recipe" ] || continue
                    count=$((count + 1))
                    recotem train "$recipe"{{ if .Values.train.failOnBusy }} --fail-on-busy{{ end }}
                  done
                  if [ "$count" -eq 0 ]; then
                    echo "no recipe files found under {{ .Values.recipes.mountPath }}" >&2
                    exit 1
                  fi
              {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}

              env:
                {{- range $key, $value := .Values.train.env }}
                {{- if $value }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
                {{- end }}
                # Signing keys from the shared Kubernetes Secret.
                - name: RECOTEM_SIGNING_KEYS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.secretName }}
                      key: RECOTEM_SIGNING_KEYS

              resources:
                {{- toYaml .Values.train.resources | nindent 16 }}

              volumeMounts:
                - name: recipes
                  mountPath: {{ .Values.recipes.mountPath }}
                  readOnly: true
                {{- if .Values.artifacts.enabled }}
                - name: artifacts
                  mountPath: {{ .Values.artifacts.mountPath }}
                  # Train needs write access; readOnly must be false for the train job.
                  readOnly: false
                {{- end }}
                - name: tmp
                  mountPath: /tmp
                # /workspace is the Dockerfile WORKDIR and the process cwd.
                # readOnlyRootFilesystem=true forbids writes to the container root
                # filesystem, so this emptyDir provides a writable cwd for lock
                # files and any tooling that creates temp files relative to cwd.
                - name: workspace
                  mountPath: /workspace

          volumes:
            - name: recipes
              {{- if eq .Values.recipes.source "configMap" }}
              configMap:
                name: {{ .Values.recipes.configMap.name }}
              {{- else if eq .Values.recipes.source "pvc" }}
              persistentVolumeClaim:
                claimName: {{ .Values.recipes.pvc.claimName }}
                readOnly: true
              {{- else if eq .Values.recipes.source "objectStore" }}
              emptyDir: {}
              {{- else }}
              {{- fail (printf "recipes.source must be one of configMap|pvc|objectStore, got %q" .Values.recipes.source) }}
              {{- end }}
            {{- if .Values.artifacts.enabled }}
            - name: artifacts
              persistentVolumeClaim:
                claimName: {{ .Values.artifacts.pvc.claimName }}
            {{- end }}
            - name: tmp
              emptyDir: {}
            - name: workspace
              emptyDir: {}

          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
