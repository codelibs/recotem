{{- if .Values.pdb.enabled -}}
{{- if and .Values.pdb.minAvailable .Values.pdb.maxUnavailable -}}
{{- fail "pdb.minAvailable and pdb.maxUnavailable are mutually exclusive — set only one (see values.yaml comment)" -}}
{{- end -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "recotem.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recotem.labels" . | nindent 4 }}
spec:
  # Scoped to the serve pods.  The budget is computed over the pods this
  # selector matches, so an unscoped selector would count a running train
  # CronJob pod as healthy and hand out a disruption the serve replicas
  # cannot afford — see recotem.serveSelectorLabels in _helpers.tpl.
  selector:
    matchLabels:
      {{- include "recotem.serveSelectorLabels" . | nindent 6 }}
  {{- if .Values.pdb.minAvailable }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- end }}
  {{- if .Values.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- end }}
{{- end }}
