# examples/k8s/serve-deployment.yaml
#
# Standalone (non-Helm) Deployment for recotem serve.
# For production use the Helm chart at helm/recotem/ instead —
# this file is intended for quick experimentation or GitOps without Helm.
#
# This pod spec sets `serviceAccountName: recotem`, so 00-serviceaccount.yaml
# must be applied first (or in the same `kubectl apply -f examples/k8s/`) —
# Kubernetes refuses to create pods for a ServiceAccount that does not exist.
#
# Serve stays NotReady (503 "degraded") until an artifact exists for every
# recipe; apply bootstrap-job.yaml to seed one. See README.md.
#
# Apply:
#   kubectl apply -f examples/k8s/00-serviceaccount.yaml
#   kubectl apply -f examples/k8s/serve-deployment.yaml
#   kubectl apply -f examples/k8s/serve-service.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: recotem-serve
  namespace: recotem
  labels:
    app.kubernetes.io/name: recotem
    app.kubernetes.io/component: serve
    app.kubernetes.io/version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: recotem
      app.kubernetes.io/component: serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recotem
        app.kubernetes.io/component: serve
    spec:
      serviceAccountName: recotem
      # Kubernetes injects a legacy Docker-link env var per Service in the
      # namespace, named <SERVICE>_PORT and valued `tcp://<clusterIP>:<port>`.
      # The chart's own Service is `recotem` by default, so every pod created
      # after it in the namespace inherits
      # `RECOTEM_PORT=tcp://10.96.0.1:8080` -- and RECOTEM_PORT is one of the
      # variables recotem treats as fatal when it does not parse as an
      # integer.  `recotem serve` and `recotem inspect` then exit 8 with
      # "Configuration error: RECOTEM_PORT must be an integer", naming a
      # variable the operator never set.  The serve container only escapes it
      # by setting RECOTEM_PORT explicitly; blanking `env.RECOTEM_PORT` in
      # values.yaml drops that line and re-opens the hole.  These env vars
      # have been deprecated since Kubernetes 1.13 and nothing here reads
      # them.
      enableServiceLinks: false
      # terminationGracePeriodSeconds must be >= RECOTEM_DRAIN_SECONDS + 5.
      # Default RECOTEM_DRAIN_SECONDS=30, so 35 is the minimum recommended value.
      terminationGracePeriodSeconds: 35
      # Spread replicas across nodes for availability.
      #
      # whenUnsatisfiable is ScheduleAnyway, not DoNotSchedule, because these
      # manifests must apply cleanly on a ReadWriteOnce artifacts PVC -- the
      # access mode the README offers for a single-node cluster.  RWO binds
      # every mounting pod to one node, and a hard hostname spread demands
      # they sit on different ones; the two together leave the second replica
      # Pending forever with the Deployment stuck at 1/2 and no error beyond
      # an unschedulable event.
      #
      # With a ReadWriteMany PVC, change this to DoNotSchedule to make the
      # spread a guarantee rather than a preference.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: recotem
              app.kubernetes.io/component: serve

      # Pod-level security context — only fields valid at this scope.
      # See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.31/#podsecuritycontext-v1-core
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Required by the Pod Security Standards "restricted" profile.
        seccompProfile:
          type: RuntimeDefault
        # fsGroup ensures mounted PVC files are owned by GID 1000 (appuser),
        # matching the Dockerfile USER.  Without this, PVC data may be
        # inaccessible when the volume's on-disk owner differs from runAsUser.
        fsGroup: 1000

      containers:
        - name: serve
          image: ghcr.io/codelibs/recotem:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["recotem", "serve", "--recipes", "/recipes"]

          # Container-level security context — fields like
          # allowPrivilegeEscalation / readOnlyRootFilesystem / capabilities
          # are only valid here, not under spec.securityContext.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:
            - name: RECOTEM_HOST
              value: "0.0.0.0"
            - name: RECOTEM_PORT
              value: "8080"
            - name: RECOTEM_WATCH_INTERVAL
              value: "10"
            - name: RECOTEM_LOG_FORMAT
              value: "json"
            - name: RECOTEM_ENV
              value: "production"
            - name: RECOTEM_DRAIN_SECONDS
              value: "30"
            # TrustedHostMiddleware defaults to "127.0.0.1,localhost".
            # External Service / Ingress traffic arrives with a different Host
            # header and will be rejected with HTTP 400. Set the hosts you
            # actually expose the API under (Service DNS, Ingress hostnames).
            # RECOTEM_ALLOWED_HOSTS REPLACES the default, it does not extend
            # it: `_split_csv_env` falls back to "127.0.0.1,localhost" only when
            # the value strips to empty. The probes below send Host: localhost,
            # so a list without `localhost` makes all three fail with HTTP 400 --
            # a correct TrustedHostMiddleware rejection, which is why the pod
            # logs nothing that points at the cause. Keep `localhost` first.
            # Example:
            #   - name: RECOTEM_ALLOWED_HOSTS
            #     value: "localhost,recotem.example.com,recotem-serve.recotem.svc.cluster.local"
            # API keys and signing keys from Secret.
            # The Secret data keys match the env var names so what the app
            # reads, what kubectl shows, and what the Secret stores are all
            # spelled identically.
            - name: RECOTEM_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: recotem-auth
                  key: RECOTEM_API_KEYS
            - name: RECOTEM_SIGNING_KEYS
              valueFrom:
                secretKeyRef:
                  name: recotem-auth
                  key: RECOTEM_SIGNING_KEYS

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Probes send Host: localhost, which passes TrustedHostMiddleware on
          # the DEFAULT allowlist (127.0.0.1,localhost) -- but not on a
          # RECOTEM_ALLOWED_HOSTS that omits it, because that variable replaces
          # the default rather than extending it. See the note on the env var
          # above; the Helm chart prepends `localhost` for you, a hand-written
          # env var does not.
          # All three probes read artifact state through the SAME question as
          # readiness: "is at least one recipe loaded?".  A startupProbe is not
          # a gate that withholds traffic -- a failing one RESTARTS the
          # container.  Pointed at the strict, count-based /v1/health it turned
          # one untrained recipe into a restart loop for every NEW pod, so a
          # rolling update or an HPA scale-out could not converge while the
          # running replicas served happily.  /v1/health/ready still answers
          # 503 on a cold store (nothing loaded), which is what keeps the
          # first-install guarantee: serve does not enter the Service before
          # train has produced something.
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi

          volumeMounts:
            - name: recipes
              mountPath: /recipes
              readOnly: true
            - name: artifacts
              mountPath: /artifacts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # /workspace is the Dockerfile WORKDIR and the process cwd.
            # readOnlyRootFilesystem=true forbids writes to the container root
            # filesystem, so this emptyDir provides a writable cwd.
            - name: workspace
              mountPath: /workspace

      volumes:
        - name: recipes
          configMap:
            name: recotem-recipes
        - name: artifacts
          persistentVolumeClaim:
            claimName: recotem-artifacts
        - name: tmp
          emptyDir: {}
        - name: workspace
          emptyDir: {}
