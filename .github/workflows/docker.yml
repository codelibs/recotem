name: recotem / docker

# Build-only on pull requests; build + push on main branch and version tags.
# Image: ghcr.io/codelibs/recotem
# Dockerfile: Dockerfile
#
# Job graph:
#   guard ──┬──> smoke (amd64, arm64) ──┬──> trivy ──┬──> build (push)
#           │                           └────────────┤
#           └──> test ────────────────────────────────┘
# Nothing is pushed until the release-tag guard, the test suite, the runtime
# smoke test and the vulnerability scan have all passed.  `build` is the only
# job that logs in to GHCR.
#
# `build` gates the push by gating the whole job: the registry login and the
# `push: true` build are steps inside it, so a failed dependency skips `build`
# entirely rather than merely shortening it.
#
# Security note: no untrusted user input (PR titles, commit messages, etc.) is
# interpolated into any run: command. All github.event.* data is used only
# via docker/metadata-action which handles escaping internally.
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

# Workflow default is read-only.  `packages: write` is granted on `build`
# alone — the one job that logs in to GHCR — rather than here, so a job added
# later without its own `permissions:` block inherits no registry write.  It
# used to be granted at this level, which handed `smoke` and `trivy` a scope
# neither ever uses.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: codelibs/recotem

jobs:
  # Gate: the tag itself, on tag-triggered runs.
  #
  # `tags:` above is a GitHub filter pattern, not a regex — a trailing `*`
  # matches zero or more of ANY character, so `v[0-9]+.[0-9]+.[0-9]*` also
  # fires on `v2.1.0.dev0` and `v2.1.0-rc1`.  Without this job a stray
  # non-final tag pushes an image to GHCR, which publish.yml's identical guard
  # does not prevent: it protects the PyPI path only.
  #
  # Reuses that same script rather than restating the rules, so the container
  # and PyPI paths cannot drift apart.  Branch pushes and pull requests carry
  # no tag ref: both steps are skipped, the job succeeds, and everything
  # downstream runs as before.
  guard:
    name: release tag guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        if: startsWith(github.ref, 'refs/tags/')

      # Also runnable locally before tagging:
      #   bash .github/scripts/check-release-tag.sh v2.1.0
      - name: Tag is a final release and matches pyproject.toml + version.py + Chart.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/check-release-tag.sh

  # Gate: the code.
  #
  # test.yml and this workflow share no dependency edge — GitHub gives none
  # between workflows — so both start at once on a push to main or a version
  # tag, and `build` used to reach GHCR while pytest was still running or had
  # already failed.  A red unit, integration or fuzz test therefore blocked the
  # PyPI upload (publish.yml carries its own `test` job for exactly this
  # reason) but not the container image, and `latest` moves on every push to
  # main.  This is that missing job on the container path.
  #
  # Deliberately a single interpreter and no e2e, unlike test.yml: the point is
  # to stop a broken build being published, not to re-run the release matrix.
  # 3.12 specifically, because that is the interpreter the image ships
  # (`FROM python:3.12-slim` in the Dockerfile) — test.yml's 3.13 and 3.14 legs
  # cover the PyPI package, where the user picks the interpreter, and a failure
  # confined to those says nothing about the container.  e2e is likewise
  # redundant here: `smoke` below already exercises train → sign → serve →
  # recommend inside the built image on both published architectures, which is
  # the e2e script's coverage applied to the artefact that actually ships.
  test:
    name: pre-push test gate
    runs-on: ubuntu-24.04
    needs: guard
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
          # uv's cache key covers pyproject.toml / uv.lock, not the build
          # environment -- so the wheel built before UV_NO_BINARY_PACKAGE and
          # LIGHTFM_NO_CFLAGS were set below is restored and reused, and the
          # variables never take effect.  Observed exactly that: a run with both
          # set still died with SIGILL in a cached
          # `_lightfm_fast_openmp.cpython-314-*.so`.  Bumping this suffix retires
          # those entries.  Bump it again if the lightfm build flags change.
          cache-suffix: lightfm-portable-1

      - name: Install dependencies (all extras)
        run: uv sync --frozen --dev --extra bigquery --extra s3 --extra gcs --extra metrics --extra postgres --extra mysql --extra sqlite --extra bprfm
        env:
          # lightfm-next publishes a linux x86_64 wheel for cp312 only, and it is
          # compiled `-march=native` on the upstream project's runner -- so on
          # 3.12 we would install that machine's ISA, and on 3.13/3.14 uv builds
          # from sdist and bakes in *this* runner's ISA instead.  Either way the
          # result is machine-specific, and `enable-cache: true` then restores it
          # onto whichever runner comes next: importing `lightfm._lightfm_fast`
          # dies with `Fatal Python error: Illegal instruction` (exit 132) when
          # that runner is older than the one that built it.  Same reasoning, and
          # the same two variables, as the Dockerfile's lightfm-next build.
          UV_NO_BINARY_PACKAGE: lightfm-next
          LIGHTFM_NO_CFLAGS: "1"

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: ruff format (check only)
        run: uv run ruff format --check src/ tests/

      - name: Run unit + integration + fuzz tests
        run: uv run pytest tests/unit tests/integration tests/fuzz --tb=short -q -m "not slow"

  # Gate: prove the built image actually runs before anything is published.
  # A multi-stage venv copy can silently produce an image whose entrypoint
  # cannot exec or whose `recotem` package never made it into the venv — a
  # build that succeeds and a `docker run` that fails are entirely compatible.
  #
  # Both published architectures are exercised on native runners
  # (ubuntu-24.04-arm is a GitHub-hosted arm64 runner, free for public repos),
  # so arm64 is executed rather than only built.  No QEMU is involved: emulated
  # numpy/scipy startup is both slow and a known source of flakes.
  smoke:
    name: image smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Single-arch so the image can be `load`ed into the local daemon and run.
      # Populates a per-arch gha cache scope that `build` and `trivy` reuse;
      # distinct scopes stop the two matrix legs clobbering each other's cache.
      - name: Build local image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: recotem:smoke
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=smoke-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.arch }}

      - name: Entrypoint runs and the package is importable
        run: |
          set -euo pipefail
          docker run --rm recotem:smoke --help > /dev/null
          docker run --rm --entrypoint python recotem:smoke \
            -c 'import recotem, irspack; print(recotem.__version__, irspack.__version__)'

      # `train` exiting 0 is not evidence that it trained anything: the image
      # has already shipped a bug where an unwritable artifacts mount made the
      # lock look contended and training skipped silently with exit 0 (see the
      # /workspace/artifacts note in the Dockerfile).  Require a real artifact
      # on disk, and require `inspect` to verify its HMAC.
      - name: Train a recipe inside the image and verify the artifact
        run: |
          set -euo pipefail
          RECIPES="${RUNNER_TEMP}/smoke-recipes"
          DATA="${RUNNER_TEMP}/smoke-data"
          ARTIFACTS="${RUNNER_TEMP}/smoke-artifacts"
          mkdir -p "${RECIPES}" "${DATA}" "${ARTIFACTS}"
          # The container runs as uid 1000; the runner user is a different uid,
          # so a bind-mounted host directory needs to be group/other writable
          # for `train` to create the artifact and its lock file.
          chmod 0777 "${ARTIFACTS}"

          python3 - "${DATA}/interactions.csv" <<'PY'
          import csv
          import random
          import sys

          random.seed(42)
          with open(sys.argv[1], "w", newline="") as handle:
              writer = csv.writer(handle)
              writer.writerow(["user_id", "item_id"])
              for _ in range(2000):
                  writer.writerow(
                      [f"u{random.randrange(100)}", f"i{random.randrange(50)}"]
                  )
          PY

          cat > "${RECIPES}/smoke.yaml" <<'YAML'
          name: smoke
          source:
            type: csv
            path: /data/interactions.csv
          schema:
            user_column: user_id
            item_column: item_id
          training:
            algorithms: [TopPop]
            n_trials: 2
            split:
              scheme: random
              heldout_ratio: 0.1
              seed: 42
          output:
            path: /artifacts/smoke.recotem
            versioning: always_overwrite
          YAML

          # Throwaway key for this run only.
          SIGNING_KEY="ci:$(openssl rand -hex 32)"
          echo "::add-mask::${SIGNING_KEY}"
          echo "SMOKE_SIGNING_KEY=${SIGNING_KEY}" >> "${GITHUB_ENV}"

          docker run --rm \
            -e RECOTEM_SIGNING_KEYS="${SIGNING_KEY}" \
            -v "${RECIPES}:/recipes:ro" \
            -v "${DATA}:/data:ro" \
            -v "${ARTIFACTS}:/artifacts" \
            recotem:smoke train /recipes/smoke.yaml

          if [ ! -s "${ARTIFACTS}/smoke.recotem" ]; then
            echo "::error::train exited 0 but wrote no artifact at /artifacts/smoke.recotem"
            ls -la "${ARTIFACTS}"
            exit 1
          fi
          echo "train wrote $(stat -c %s "${ARTIFACTS}/smoke.recotem") bytes"

          # Verifies magic, version and HMAC without deserialising the payload.
          docker run --rm \
            -e RECOTEM_SIGNING_KEYS="${SIGNING_KEY}" \
            -v "${ARTIFACTS}:/artifacts:ro" \
            recotem:smoke inspect /artifacts/smoke.recotem

      - name: Serve the trained model and answer a recommendation
        run: |
          set -euo pipefail
          # No API keys are set, so serve binds 127.0.0.1 inside the container
          # and every probe below runs via `docker exec`.  Authentication is
          # covered by tests/e2e/run.sh, which runs the authenticated posture.
          docker run -d --name recotem-smoke \
            -e RECOTEM_SIGNING_KEYS="${SMOKE_SIGNING_KEY}" \
            -v "${RUNNER_TEMP}/smoke-recipes:/recipes:ro" \
            -v "${RUNNER_TEMP}/smoke-artifacts:/artifacts:ro" \
            recotem:smoke serve --recipes /recipes

          PROBE=$(cat <<'PY'
          import sys, urllib.error, urllib.request
          try:
              print(urllib.request.urlopen(
                  "http://127.0.0.1:8080" + sys.argv[1], timeout=3).status)
          except urllib.error.HTTPError as exc:
              print(exc.code)
          except Exception:
              print("000")
          PY
          )

          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' recotem-smoke)" != "true" ]; then
              echo "::error::serve container exited before becoming ready (exit $(docker inspect -f '{{.State.ExitCode}}' recotem-smoke))"
              exit 1
            fi
            code=$(docker exec recotem-smoke python -c "$PROBE" /v1/health || echo 000)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done

          code=$(docker exec recotem-smoke python -c "$PROBE" /v1/health || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::/v1/health returned $code, expected 200"
            exit 1
          fi
          echo "/v1/health -> 200"

          # The API router is mounted under /v1. Bare /health used to be what
          # every probe in the repo targeted, which made containers permanently
          # unhealthy and k8s pods CrashLoopBackOff. Assert it stays a 404 so a
          # future edit cannot quietly reintroduce the wrong path.
          code=$(docker exec recotem-smoke python -c "$PROBE" /health || echo 000)
          if [ "$code" != "404" ]; then
            echo "::error::bare /health returned $code, expected 404"
            exit 1
          fi
          echo "/health -> 404 (as expected)"

          # /v1/health returning ok with total=0 is what an EMPTY recipes
          # directory produces, and it used to be all this job asserted.
          # Require a model to actually be loaded, then require it to answer.
          docker exec -i recotem-smoke python - <<'PY'
          import json
          import sys
          import urllib.request

          BASE = "http://127.0.0.1:8080"


          def get(path):
              with urllib.request.urlopen(BASE + path, timeout=10) as resp:
                  return resp.status, json.load(resp)


          def post(path, payload):
              req = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, json.load(resp)


          status, health = get("/v1/health")
          print("/v1/health ->", status, health)
          if status != 200:
              sys.exit(f"/v1/health returned {status}, expected 200")
          if health.get("status") != "ok":
              sys.exit(f"/v1/health status is {health.get('status')!r}, expected 'ok'")
          if health.get("total", 0) < 1:
              sys.exit(
                  "no recipes registered — an empty recipes dir also reports "
                  f"status=ok, so this assertion is the gate: {health}"
              )
          if health.get("loaded") != health.get("total"):
              sys.exit(f"not every recipe loaded: {health}")

          status, body = post(
              "/v1/recipes/smoke:recommend", {"user_id": "u0", "limit": 5}
          )
          print("/v1/recipes/smoke:recommend ->", status)
          if status != 200:
              sys.exit(f":recommend returned {status}, expected 200")
          items = body.get("items")
          if not isinstance(items, list) or not items:
              sys.exit(f":recommend returned no items: {body}")
          if not body.get("model_version"):
              sys.exit(f":recommend response has no model_version: {body}")
          print("recommended", len(items), "items from", body["model_version"][:23])
          print("OK: image trained, signed, loaded and served a model")
          PY

      - name: Image HEALTHCHECK reports healthy
        run: |
          set -euo pipefail
          # Guards the HEALTHCHECK line in the Dockerfile itself: start_period
          # is 30s and interval 30s, so allow a generous window.
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' recotem-smoke)
            if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ]; then break; fi
            sleep 3
          done
          status=$(docker inspect -f '{{.State.Health.Status}}' recotem-smoke)
          if [ "$status" != "healthy" ]; then
            echo "::error::container health is '$status', expected 'healthy'"
            docker inspect -f '{{json .State.Health}}' recotem-smoke
            exit 1
          fi
          echo "container health -> healthy"

      - name: Serve logs
        if: always()
        run: docker logs recotem-smoke 2>&1 | tail -50 || true

      - name: Tear down smoke container
        if: always()
        run: docker rm -f recotem-smoke || true

  # Gate: scan BEFORE the push, not after.
  #
  # This job used to run `needs: build`, so a fixable HIGH/CRITICAL turned the
  # run red only once the image — and the mutable `latest` tag — was already
  # live on GHCR.  It now sits between `smoke` and `build`.
  trivy:
    name: trivy vulnerability scan
    runs-on: ubuntu-24.04
    needs: smoke
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: recotem:scan
          platforms: linux/amd64
          cache-from: type=gha,scope=smoke-amd64

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: recotem:scan
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          # Without this, `format: sarif` causes trivy-action to override
          # TRIVY_SEVERITY to include all severities ("Building SARIF report
          # with all severities"), which makes `exit-code: 1` fire on
          # MEDIUM/LOW findings too — defeating the `severity` filter.
          limit-severities-for-sarif: true
          # Skip CVEs without an upstream fix.  Slim base images frequently
          # carry HIGH OS CVEs (libcap2, ncurses-bin, libudev1, ...) that
          # have no fixed Debian version yet — gating CI on these would mean
          # the pipeline is permanently red with nothing the project can do
          # about it.
          #
          # Fixable ones are a different matter, and this gate now blocks the
          # push rather than merely reporting after it.  The Dockerfile runs
          # `apt-get upgrade` in the base stage so that the moment Debian
          # publishes a fix for one of the currently-unfixed base CVEs, the
          # image picks it up — otherwise this job would turn red on a branch
          # that changed nothing, with no repo-side remedy available until
          # python:3.12-slim itself is rebuilt.
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy SARIF as artifact (for download)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

  build:
    name: docker build
    runs-on: ubuntu-24.04
    needs: [test, smoke, trivy]
    # The only job that logs in to GHCR, and so the only one granted write.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is published only for the default branch (main) and for
          # semver tag pushes — `compose.yaml` and the getting-started docs
          # reference :latest, so it must actually exist on GHCR.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha
            type=gha,scope=smoke-amd64
            type=gha,scope=smoke-arm64
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
