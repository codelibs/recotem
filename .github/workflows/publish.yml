name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least-privilege: read-only by default; each job adds only what it needs.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: the tag itself.
  #
  # A PyPI upload is irreversible — a filename can never be reused — so a
  # `.dev0` / `a0` / `rc1` published by accident is permanent.  This job runs
  # before any build or upload step and refuses anything that is not a clean
  # PEP 440 final release agreeing with both in-tree version declarations.
  # ---------------------------------------------------------------------------
  guard:
    name: release tag guard
    runs-on: ubuntu-24.04
    # Reading the release milestone's pull requests needs one extra scope.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Assert tag trigger
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *) echo "::error::publish.yml requires a v* tag ref, got '${GITHUB_REF}'"; exit 1 ;;
          esac

      # fetch-depth: 0 — BOTH steps below ask an ancestry question that a
      # shallow clone cannot answer: check-release-tag.sh asserts the tagged
      # commit is an ancestor of main, and check-milestone-landed.sh asserts
      # every milestone PR's merge commit is an ancestor of the tag.  Measured
      # at depth 1: origin/main does not resolve at all.  Both scripts refuse
      # that state rather than guessing, so removing this line fails the guard
      # loudly instead of making either check vacuous.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Also runnable locally before tagging:
      #   bash .github/scripts/check-release-tag.sh v2.1.0
      - name: Tag is a final release and matches pyproject.toml + version.py + Chart.yaml
        run: bash .github/scripts/check-release-tag.sh

      # A PR can read MERGED on GitHub and still not be in main — see the
      # script's header for the case that happened.  This asks the reverse of
      # the ancestry question check-release-tag.sh asks: that script checks the
      # tag is on main, this one checks the milestone is in the tag.  Neither
      # implies the other, and both are needed.
      #
      # Also runnable locally before tagging:
      #   bash .github/scripts/check-milestone-landed.sh v2.1.0
      - name: Every merged PR in the release milestone is actually in this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-milestone-landed.sh

  # ---------------------------------------------------------------------------
  # Gate 2: the code.
  #
  # test.yml runs on pushes to main and on pull requests; a tag can be created
  # on any commit, so without this job nothing verifies the code between
  # tagging and the PyPI upload.  Single interpreter and no e2e — this is a
  # release-blocking smoke gate, not a replacement for test.yml's full matrix,
  # which also runs on tag pushes.
  # ---------------------------------------------------------------------------
  test:
    name: pre-publish test gate
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      # `--locked`, not `--frozen`.  `--frozen` installs from uv.lock without
      # checking it against pyproject.toml, so a release that bumps the
      # version but forgets `uv lock` sails through: measured, `uv sync
      # --frozen` exits 0 with pyproject at 2.1.0 and uv.lock recording
      # 2.1.0.dev0, while `uv sync --locked` exits 1 naming the lockfile.
      # The release-tag guard cannot catch it: that script reads pyproject,
      # version.py and the chart, and its success message says as much -- it
      # never claims the lockfile.  Every other `uv sync` in the repository now
      # passes --locked too, and test.yml runs `uv lock --check` explicitly, so
      # this is the release path's copy of a check the whole repository shares
      # rather than the only one.
      - name: Install dependencies (all extras)
        run: uv sync --locked --dev --extra bigquery --extra s3 --extra gcs --extra metrics --extra postgres --extra mysql --extra sqlite

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: ruff format (check only)
        run: uv run ruff format --check src/ tests/

      - name: Run unit + integration + fuzz tests
        run: uv run pytest tests/unit tests/integration tests/fuzz --tb=short -q -m "not slow"

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Build sdist + wheel
        run: uv build

      # The gate above proved the tag matches pyproject.toml; this proves the
      # artefacts uv actually produced carry that version, so a stale
      # dist/ or a build-backend surprise cannot slip a different filename
      # onto PyPI.
      - name: Built artefacts carry the tagged version
        run: |
          set -euo pipefail
          expected="${GITHUB_REF#refs/tags/v}"
          echo "Expecting version ${expected} in dist/:"
          ls -1 dist/
          if [ ! -f "dist/recotem-${expected}.tar.gz" ]; then
            echo "::error::dist/recotem-${expected}.tar.gz is missing — built version does not match tag ${GITHUB_REF#refs/tags/}"
            exit 1
          fi
          if ! ls "dist/recotem-${expected}-"*.whl > /dev/null 2>&1; then
            echo "::error::no dist/recotem-${expected}-*.whl — built version does not match tag ${GITHUB_REF#refs/tags/}"
            exit 1
          fi
          # Nothing else may ride along: an extra file here would be uploaded too.
          count=$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected exactly 2 distribution files in dist/, found ${count}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/recotem
    permissions:
      id-token: write      # Required for OIDC trusted publishing
      attestations: write  # Required for Sigstore attestations (pypa/gh-action-pypi-publish v1.10+)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Pinned to a commit, not to `release/v1`.  That is a mutable *branch*:
      # whatever it points at is what runs in the one job in this repository
      # holding `id-token: write`, and a PyPI filename can never be reused, so
      # a bad publish from a moved branch tip is permanent.  Every other action
      # here sits on a version tag that Dependabot's github-actions updater
      # already watches; it cannot track a branch ref at all, so this reference
      # was the only one under nothing's supervision.  The pin resolves to the
      # same commit `release/v1` currently points at (v1.14.2) — Dependabot
      # bumps the SHA and this comment together from here on.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          # Input name is `attestations`, not `generate-attestations`: the
          # latter is silently ignored, so the `attestations: write` permission
          # above would be load-bearing only by upstream's default.
          attestations: true
