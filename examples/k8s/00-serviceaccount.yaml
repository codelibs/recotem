# examples/k8s/00-serviceaccount.yaml
#
# ServiceAccount referenced by serve-deployment.yaml, cronjob.yaml and
# bootstrap-job.yaml (`serviceAccountName: recotem`).
#
# This manifest is NOT optional. Without it the ReplicaSet and Job controllers
# refuse to create pods:
#
#   Error creating: pods "recotem-serve-..." is forbidden: error looking up
#   service account recotem/recotem: serviceaccount "recotem" not found
#
# ...and the Deployment sits at zero ready replicas indefinitely.
#
# The "00-" prefix is load-bearing: `kubectl apply -f examples/k8s/` applies
# files in lexical order, so this sorts ahead of the workloads that reference
# it. Without the prefix the controllers still converge on retry, but the
# apply emits the alarming FailedCreate warning above before doing so.
#
# Apply this before (or together with) the other manifests:
#   kubectl apply -f examples/k8s/00-serviceaccount.yaml

apiVersion: v1
kind: ServiceAccount
metadata:
  name: recotem
  namespace: recotem
  labels:
    app.kubernetes.io/name: recotem
  # Recotem never calls the Kubernetes API, so no Role/RoleBinding is needed.
  # Cloud IAM identity for s3:// / gs:// artifact paths is attached here:
  #
  #   annotations:
  #     # EKS (IRSA)
  #     eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/recotem
  #     # GKE (Workload Identity)
  #     iam.gke.io/gcp-service-account: recotem@my-project.iam.gserviceaccount.com
  #
  # Both mechanisms inject their own projected token volume via an admission
  # webhook, so they keep working with automountServiceAccountToken: false.

# Recotem makes no Kubernetes API calls; do not project the API token into
# the pod filesystem.
automountServiceAccountToken: false
