name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least-privilege: read-only by default; each job adds only what it needs.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: the tag itself.
  #
  # A PyPI upload is irreversible — a filename can never be reused — so a
  # `.dev0` / `a0` / `rc1` published by accident is permanent.  This job runs
  # before any build or upload step and refuses anything that is not a clean
  # PEP 440 final release agreeing with both in-tree version declarations.
  # ---------------------------------------------------------------------------
  guard:
    name: release tag guard
    runs-on: ubuntu-24.04
    steps:
      - name: Assert tag trigger
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *) echo "::error::publish.yml requires a v* tag ref, got '${GITHUB_REF}'"; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      # Also runnable locally before tagging:
      #   bash .github/scripts/check-release-tag.sh v2.1.0
      - name: Tag is a final release and matches pyproject.toml + version.py
        run: bash .github/scripts/check-release-tag.sh

  # ---------------------------------------------------------------------------
  # Gate 2: the code.
  #
  # test.yml runs on pushes to main and on pull requests; a tag can be created
  # on any commit, so without this job nothing verifies the code between
  # tagging and the PyPI upload.  Single interpreter and no e2e — this is a
  # release-blocking smoke gate, not a replacement for test.yml's full matrix,
  # which also runs on tag pushes.
  # ---------------------------------------------------------------------------
  test:
    name: pre-publish test gate
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (all extras)
        run: uv sync --frozen --dev --extra bigquery --extra s3 --extra gcs --extra metrics --extra postgres --extra mysql --extra sqlite

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: ruff format (check only)
        run: uv run ruff format --check src/ tests/

      - name: Run unit + integration + fuzz tests
        run: uv run pytest tests/unit tests/integration tests/fuzz --tb=short -q -m "not slow"

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Build sdist + wheel
        run: uv build

      # The gate above proved the tag matches pyproject.toml; this proves the
      # artefacts uv actually produced carry that version, so a stale
      # dist/ or a build-backend surprise cannot slip a different filename
      # onto PyPI.
      - name: Built artefacts carry the tagged version
        run: |
          set -euo pipefail
          expected="${GITHUB_REF#refs/tags/v}"
          echo "Expecting version ${expected} in dist/:"
          ls -1 dist/
          if [ ! -f "dist/recotem-${expected}.tar.gz" ]; then
            echo "::error::dist/recotem-${expected}.tar.gz is missing — built version does not match tag ${GITHUB_REF#refs/tags/}"
            exit 1
          fi
          if ! ls "dist/recotem-${expected}-"*.whl > /dev/null 2>&1; then
            echo "::error::no dist/recotem-${expected}-*.whl — built version does not match tag ${GITHUB_REF#refs/tags/}"
            exit 1
          fi
          # Nothing else may ride along: an extra file here would be uploaded too.
          count=$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected exactly 2 distribution files in dist/, found ${count}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/recotem
    permissions:
      id-token: write      # Required for OIDC trusted publishing
      attestations: write  # Required for Sigstore attestations (pypa/gh-action-pypi-publish v1.10+)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Input name is `attestations`, not `generate-attestations`: the
          # latter is silently ignored, so the `attestations: write` permission
          # above would be load-bearing only by upstream's default.
          attestations: true
