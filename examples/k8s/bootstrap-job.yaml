# examples/k8s/bootstrap-job.yaml
#
# One-shot bootstrap training Job.
#
# WHY THIS EXISTS
# ---------------
# `recotem serve` answers /v1/health with 503 and {"status":"degraded"} while
# any recipe has no artifact to load. On a brand-new install the artifacts PVC
# is empty, so every serve pod fails its probes and is restarted, and the
# CronJob will not produce the first artifact until its next scheduled run
# (02:00 UTC by default) — potentially many hours later.
#
# This Job trains every recipe once, immediately, so the shared PVC is seeded
# and the serve Deployment can become ready. It is the same container spec as
# cronjob.yaml, just run once instead of on a schedule.
#
# The serve pods restart a few times while this Job runs. That is expected and
# self-healing: once the artifact lands, the watcher picks it up and the pods
# go Ready without any manual step.
#
# Usage:
#   kubectl apply -f examples/k8s/bootstrap-job.yaml
#   kubectl -n recotem wait --for=condition=complete job/recotem-bootstrap --timeout=30m
#
# The Job is deliberately left in place after it completes so that re-running
# `kubectl apply -f examples/k8s/` is a no-op rather than a surprise retrain.
# To seed again (e.g. after changing a recipe), delete and re-apply it:
#   kubectl -n recotem delete job recotem-bootstrap
#   kubectl apply -f examples/k8s/bootstrap-job.yaml

apiVersion: batch/v1
kind: Job
metadata:
  name: recotem-bootstrap
  namespace: recotem
  labels:
    app.kubernetes.io/name: recotem
    app.kubernetes.io/component: train
spec:
  # Give up rather than retry forever on a persistent config error
  # (exit 2 = recipe, 3 = datasource, 5 = artifact are not retryable).
  backoffLimit: 2
  # Hard deadline: 2 hours, matching cronjob.yaml.
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recotem
        app.kubernetes.io/component: train
    spec:
      serviceAccountName: recotem
      restartPolicy: OnFailure
      # Pod-level security context — only fields valid at this scope.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Required by the Pod Security Standards "restricted" profile.
        seccompProfile:
          type: RuntimeDefault
        # fsGroup ensures mounted PVC files are owned by GID 1000 (appuser),
        # matching the Dockerfile USER.  Without this, PVC data may be
        # inaccessible when the volume's on-disk owner differs from runAsUser.
        fsGroup: 1000

      containers:
        - name: train
          image: ghcr.io/codelibs/recotem:2.0.0
          imagePullPolicy: IfNotPresent
          # Container-level security context — fields like
          # allowPrivilegeEscalation / readOnlyRootFilesystem are only
          # valid here, not under spec.securityContext.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Train all recipes in /recipes.  Fail loudly when the directory is
          # empty, so a wrong ConfigMap name surfaces here instead of as an
          # unexplained 503 from serve.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              count=0
              for recipe in /recipes/*.yaml; do
                [ -f "$recipe" ] || continue
                count=$((count + 1))
                recotem train "$recipe"
              done
              if [ "$count" -eq 0 ]; then
                echo "no recipe files found under /recipes" >&2
                exit 1
              fi
          env:
            - name: RECOTEM_LOG_FORMAT
              value: "json"
            - name: RECOTEM_SIGNING_KEYS
              valueFrom:
                secretKeyRef:
                  name: recotem-auth
                  key: RECOTEM_SIGNING_KEYS
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: recipes
              mountPath: /recipes
              readOnly: true
            - name: artifacts
              mountPath: /artifacts
              readOnly: false
            - name: tmp
              mountPath: /tmp
            # /workspace is the Dockerfile WORKDIR and the process cwd.
            # readOnlyRootFilesystem=true forbids writes to the container root
            # filesystem, so this emptyDir provides a writable cwd for lock
            # files and any tooling that creates temp files relative to cwd.
            - name: workspace
              mountPath: /workspace

      volumes:
        - name: recipes
          configMap:
            name: recotem-recipes
        - name: artifacts
          persistentVolumeClaim:
            claimName: recotem-artifacts
        - name: tmp
          emptyDir: {}
        - name: workspace
          emptyDir: {}
